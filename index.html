<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="_css/css_externo.css">
</head>

<body>
    <h1>Exemplos de Formulário em HTML</h1>
    <hr>
    <form>
        <h3>Exemplo 01</h2>
            <label><input class="f1" type="text" placeholder="Nome"></label>
            <label><input class="f1" type="email" placeholder="Email"></label>
            <label><input class="f1" type="number" placeholder="Celular"></label>
            <label><input class="f1" type="password" placeholder="senha"></label>
            <label><input class="f1s" type="submit" value="Cadastrar"></label>
    </form>
    <hr>
    <h3>Exemplo 02</h3>
    <textarea class="f2textarea"></textarea>
    <hr>
    <h3>Exemplo 03</h3>
    <div>
        <fieldset class="f3field">
            <legend class="f3legend">Formulário</legend>
            <label>Nome: <input type="text"></label>
            <br><br>
            <label>Sexo: </label>
            <input type="radio">Masculino
            <input type="radio">Feminino
            <br><br>
            <label>País</label>
            <select>
                <option>Selecione uma opção</option>
                <option>Brasil</option>
                <option>Chile</option>
                <option>Uruguai</option>
                <option>Paraguai</option>
                <option>Equador</option>
            </select>
            <br><br>
            <label>Mensagem:<br><textarea class="f3textarea"></textarea></label>
            <p></p>
            <input type="checkbox"> Assinar Newsletter?
            <p></p>
            <input type="submit">
        </fieldset>
    </div>
    <hr>
    <h3>Exemplo 04</h3>
    <form action="" method="">
        <input class="f4" type="search">
        <input class="f4s" type="submit" value="Clique para pesquisar">
    </form>
    <hr>
    <h3>Exemplo 05</h3>
    <fieldset class="f5field">
        <br>
        <legend class="f5legend"><b>Selecione a cor que mais agrada?</b></legend>
        <label class="f5"><input type="checkbox"> <b>azul</b></label>
        <label class="f5"><input type="checkbox"> <b>vermelho</b></label>
        <label class="f5"><input type="checkbox"> <b>verde</b></label>
        <label class="f5"><input type="checkbox"> <b>amarelo</b></label>
        <br><br>
    </fieldset>
</body>

</html>
